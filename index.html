<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Splat Window — gyro Gaussian splat viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }

    .overlay { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    h1 { font-size: 14px; font-weight: 600; letter-spacing: .02em; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
    h1 span { opacity: .55; font-weight: 400; }

    select { pointer-events: auto; appearance: none; background: rgba(20,20,24,.72); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 7px 12px; font-size: 13px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

    .bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #hint { font-size: 13px; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px rgba(0,0,0,.7); text-align: center; transition: opacity .6s; }
    #hint.hidden { opacity: 0; }

    #motionBtn { pointer-events: auto; display: none; border: 0; border-radius: 999px; padding: 14px 26px; font-size: 16px; font-weight: 600; color: #0b0b0e; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.45); }
    #motionBtn:active { transform: scale(.97); }

    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; transition: opacity .5s; z-index: 10; }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader .label { font-size: 13px; color: rgba(255,255,255,.7); letter-spacing: .04em; }
    #bar { width: min(220px, 60vw); height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
    #barFill { height: 100%; width: 0%; background: #fff; border-radius: 2px; transition: width .15s; }

    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 70px); transform: translateX(-50%); background: rgba(20,20,24,.85); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .4s; pointer-events: none; max-width: 84vw; text-align: center; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="overlay">
    <div class="top">
      <h1>Splat Window <span>· SparkJS + gyro</span></h1>
      <select id="scenePicker" aria-label="Scene"></select>
    </div>
    <div class="bottom">
      <div id="hint">Move your phone around to look through the window</div>
      <button id="motionBtn">Enable Motion</button>
    </div>
  </div>

  <div id="loader">
    <div id="bar"><div id="barFill"></div></div>
    <div class="label" id="loaderLabel">Loading splat…</div>
  </div>
  <div id="toast"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
