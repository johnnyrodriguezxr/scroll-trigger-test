<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ink Box — gyro liquid in a glass box</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }

    /* Soft vignette so the screen edges read as the glass frame of the box */
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(120% 120% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,.38) 88%, rgba(0,0,0,.62) 100%); }

    .overlay { position: fixed; inset: 0; pointer-events: none; z-index: 6; display: flex; flex-direction: column; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    h1 { font-size: 14px; font-weight: 600; letter-spacing: .02em; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
    h1 span { opacity: .55; font-weight: 400; }

    .bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #hint { font-size: 13px; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px rgba(0,0,0,.7); text-align: center; transition: opacity .6s; }
    #hint.hidden { opacity: 0; }

    #motionBtn { pointer-events: auto; display: none; border: 0; border-radius: 999px; padding: 14px 26px; font-size: 16px; font-weight: 600; color: #0b0b0e; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.45); }
    #motionBtn:active { transform: scale(.97); }

    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 70px); transform: translateX(-50%); background: rgba(20,20,24,.85); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .4s; pointer-events: none; max-width: 84vw; text-align: center; z-index: 7; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>

  <div class="overlay">
    <div class="top">
      <h1>Ink Box <span>· sealed liquid + gyro</span></h1>
    </div>
    <div class="bottom">
      <div id="hint">Tilt &amp; shake your phone — the screen is the front of the box</div>
      <button id="motionBtn">Enable Motion</button>
    </div>
  </div>

  <div id="toast"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./box.js"></script>
</body>
</html>
